<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Login | Futuristic Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

:root {
  --primary-blue: #0d47a1;
  --accent-blue: #2196f3;
  --primary-violet: #7b1fa2;
  --accent-violet: #e040fb;
  --neon-blue: #00e5ff;
  --neon-violet: #d500f9;
  --light-bg: #f5f7ff;
  --card-bg: #ffffff;
  --dark-bg: #0a0e17;
  --text-dark: #1a237e;
  --text-light: #e8eaf6;
  --border-light: rgba(33, 150, 243, 0.1);
  --shadow-glow: 0 0 20px rgba(33, 150, 243, 0.3);
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--dark-bg) 0%, #1a237e 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(33, 150, 243, 0.05) 0%, transparent 70%);
  animation: pulse 20s infinite alternate;
}

@keyframes pulse {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 0.5; }
  100% { transform: translate(5%, 5%) rotate(5deg); opacity: 0.8; }
}

.login-container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
  z-index: 10;
}

.login-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 40px 35px;
  box-shadow: var(--shadow-glow), 0 15px 35px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
  position: relative;
  overflow: hidden;
  transition: transform 0.5s ease, box-shadow 0.5s ease;
}

.login-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 40px rgba(33, 150, 243, 0.4), 0 20px 40px rgba(0, 0, 0, 0.6);
}

.login-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(123, 31, 162, 0.1), transparent);
  transform: rotate(45deg);
  animation: shine 8s infinite linear;
  z-index: 1;
}

@keyframes shine {
  0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
  100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

.header {
  text-align: center;
  margin-bottom: 35px;
  position: relative;
  z-index: 2;
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 15px;
}

.logo-icon {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 22px;
  box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--neon-blue), var(--neon-violet));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 0.5px;
}

.subtitle {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.7);
  font-weight: 300;
  margin-top: 5px;
}

.input-group {
  margin-bottom: 25px;
  position: relative;
  z-index: 2;
}

.input-label {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-light);
  font-size: 14px;
  margin-bottom: 8px;
  font-weight: 500;
}

.input-label i {
  color: var(--neon-blue);
  width: 20px;
  text-align: center;
}

.input-field {
  width: 100%;
  padding: 16px 20px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(33, 150, 243, 0.3);
  border-radius: 12px;
  color: white;
  font-size: 15px;
  transition: all 0.3s ease;
  outline: none;
}

.input-field:focus {
  border-color: var(--neon-blue);
  box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.2);
  background: rgba(255, 255, 255, 0.12);
}

.input-field::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

.login-button {
  width: 100%;
  padding: 18px;
  background: linear-gradient(90deg, var(--primary-blue), var(--primary-violet));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 10px;
  position: relative;
  overflow: hidden;
  z-index: 2;
}

.login-button:hover {
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-violet));
  box-shadow: 0 0 25px rgba(33, 150, 243, 0.5);
  transform: translateY(-2px);
}

.login-button:active {
  transform: translateY(0);
}

.button-glow {
  position: absolute;
  top: -10px;
  left: -100%;
  width: 100%;
  height: 150%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transform: rotate(25deg);
  transition: left 0.7s ease;
}

.login-button:hover .button-glow {
  left: 100%;
}

.error-message {
  color: #ff5252;
  font-size: 14px;
  text-align: center;
  margin-top: 20px;
  min-height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 2;
  position: relative;
}

.error-message.show {
  opacity: 1;
}

.footer {
  text-align: center;
  margin-top: 30px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 13px;
  z-index: 2;
  position: relative;
}

.footer a {
  color: var(--neon-blue);
  text-decoration: none;
  transition: color 0.3s;
}

.footer a:hover {
  color: var(--neon-violet);
  text-decoration: underline;
}

/* 3D Elements */
.floating-shapes {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 1;
}

.shape {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(33, 150, 243, 0.1), rgba(224, 64, 251, 0.1));
  animation: float-shape 15s infinite linear;
}

.shape:nth-child(1) {
  width: 80px;
  height: 80px;
  top: 10%;
  left: 5%;
  animation-duration: 20s;
}

.shape:nth-child(2) {
  width: 120px;
  height: 120px;
  bottom: 15%;
  right: 10%;
  animation-duration: 25s;
  animation-direction: reverse;
}

.shape:nth-child(3) {
  width: 60px;
  height: 60px;
  top: 60%;
  left: 15%;
  animation-duration: 18s;
}

@keyframes float-shape {
  0% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(20px, -20px) rotate(90deg); }
  50% { transform: translate(0, -40px) rotate(180deg); }
  75% { transform: translate(-20px, -20px) rotate(270deg); }
  100% { transform: translate(0, 0) rotate(360deg); }
}

/* Loader */
.loader-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 14, 23, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.loader-container.active {
  opacity: 1;
  visibility: visible;
}

.neon-loader {
  width: 120px;
  height: 120px;
  position: relative;
}

.neon-loader .circle {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 5px solid transparent;
  border-top-color: var(--neon-blue);
  animation: spin 1.5s linear infinite;
}

.neon-loader .circle:nth-child(2) {
  width: 80%;
  height: 80%;
  top: 10%;
  left: 10%;
  border-top-color: var(--neon-violet);
  animation: spin 1.2s linear infinite reverse;
}

.neon-loader .circle:nth-child(3) {
  width: 60%;
  height: 60%;
  top: 20%;
  left: 20%;
  border-top-color: var(--accent-blue);
  animation: spin 0.9s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loader-text {
  color: white;
  margin-top: 20px;
  font-size: 16px;
  text-align: center;
  background: linear-gradient(90deg, var(--neon-blue), var(--neon-violet));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 600;
  letter-spacing: 1px;
}

/* Responsive */
@media (max-width: 480px) {
  .login-container {
    padding: 15px;
  }
  
  .login-card {
    padding: 30px 25px;
  }
  
  h1 {
    font-size: 24px;
  }
  
  .input-field {
    padding: 14px 18px;
  }
}



  /* =========================
   Mobile UX Improvements
   ========================= */

/* Prevent horizontal scroll on mobile */
html, body {
  width: 100%;
  overflow-x: hidden;
}

/* Better vertical centering on small height screens */
@media (max-height: 700px) {
  body {
    align-items: flex-start;
    padding-top: 30px;
    padding-bottom: 30px;
  }
}

/* Improve container fit on small screens */
@media (max-width: 480px) {
  .login-container {
    max-width: 100%;
    padding: 12px;
  }

  .login-card {
    padding: 24px 18px;
    border-radius: 16px;
  }

  .header {
    margin-bottom: 24px;
  }

  .logo {
    gap: 8px;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    font-size: 18px;
  }

  h1 {
    font-size: 22px;
    line-height: 1.2;
    text-align: center;
  }

  .subtitle {
    font-size: 13px;
    text-align: center;
  }

  .input-group {
    margin-bottom: 20px;
  }

  .input-label {
    font-size: 13px;
  }

  .input-field {
    padding: 14px 16px;
    font-size: 14px;
    border-radius: 10px;
  }

  /* Bigger tap target for mobile */
  .login-button {
    padding: 16px;
    font-size: 15px;
    border-radius: 10px;
  }

  .login-button i {
    font-size: 14px;
  }

  .error-message {
    font-size: 13px;
    margin-top: 16px;
    text-align: center;
  }

  .footer {
    margin-top: 22px;
    font-size: 12px;
    line-height: 1.5;
  }

  .footer p {
    margin: 4px 0;
  }
}

/* Disable hover-only effects on touch devices */
@media (hover: none) {
  .login-card:hover {
    transform: none;
    box-shadow: var(--shadow-glow), 0 15px 35px rgba(0, 0, 0, 0.5);
  }

  .login-button:hover {
    transform: none;
    box-shadow: none;
  }
}

/* Loader scaling for mobile */
@media (max-width: 480px) {
  .neon-loader {
    width: 90px;
    height: 90px;
  }

  .loader-text {
    font-size: 14px;
  }
}


  
</style>
</head>

<body>
  <!-- Floating 3D Shapes -->
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <!-- Loader -->
  <div class="loader-container" id="loader">
    <div class="loader-content">
      <div class="neon-loader">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <div class="loader-text">AUTHENTICATING...</div>
    </div>
  </div>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-card">
      <div class="header">
        <div class="logo">
          <div class="logo-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <h1>Secure Login</h1>
        </div>
        <div class="subtitle">Enter your credentials to access the portal</div>
      </div>

      <div class="input-group">
        <div class="input-label">
          <i class="fas fa-user"></i>
          <span>User ID</span>
        </div>
        <input type="text" id="userId" class="input-field" placeholder="Enter your user ID">
      </div>

      <div class="input-group">
        <div class="input-label">
          <i class="fas fa-key"></i>
          <span>Password</span>
        </div>
        <input type="password" id="password" class="input-field" placeholder="Enter your password">
      </div>

      <button class="login-button" onclick="login()">
        <span class="button-glow"></span>
        <i class="fas fa-sign-in-alt"></i>
        <span>Login</span>
      </button>

      <div class="error-message" id="error">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text"></span>
      </div>

      <div class="footer">
        <p>Secure access portal • <a href="#">Forgot password?</a></p>
        <p style="margin-top: 8px; font-size: 12px;">v2.1 • Futuristic Design System</p>
      </div>
    </div>
  </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxYmXM5N3bZA7BQlSHZKTe2LjgqO1EIyDLq6PvV3DYfZCsgK-lcJsh-ZjghUDUPIQy9eA/exec";

// DOM Elements
const userIdInput = document.getElementById('userId');
const passwordInput = document.getElementById('password');
const errorElement = document.getElementById('error');
const errorText = document.getElementById('error-text');
const loader = document.getElementById('loader');

// Show error message
function showError(message) {
  errorText.textContent = message;
  errorElement.classList.add('show');
  
  // Auto hide error after 5 seconds
  setTimeout(() => {
    errorElement.classList.remove('show');
  }, 5000);
}

// Show loader
function showLoader() {
  loader.classList.add('active');
}

// Hide loader
function hideLoader() {
  loader.classList.remove('active');
}

// Simulate API response for demo (remove in production)
async function mockApiRequest(id, pass) {
  return new Promise(resolve => {
    setTimeout(() => {
      // Demo credentials
      if (id === "admin" && pass === "admin123") {
        resolve({
          success: true,
          token: "demo_token_admin_12345",
          role: "Admin"
        });
      } else if (id === "coordinator" && pass === "coord123") {
        resolve({
          success: true,
          token: "demo_token_coord_67890",
          role: "Coordinator"
        });
      } else if (id && pass) {
        // Random success for demo purposes (25% chance)
        if (Math.random() < 0.25) {
          resolve({
            success: true,
            token: "demo_token_" + Math.random().toString(36).substring(2),
            role: Math.random() > 0.5 ? "Admin" : "Coordinator"
          });
        } else {
          resolve({
            success: false
          });
        }
      } else {
        resolve({
          success: false
        });
      }
    }, 1500);
  });
}

async function login() {
  // Reset error state
  errorElement.classList.remove('show');
  
  const id = userIdInput.value.trim();
  const pass = passwordInput.value.trim();

  // Validation
  if (!id || !pass) {
    showError("Please enter both User ID and Password");
    
    // Add shake animation to empty fields
    if (!id) {
      userIdInput.style.animation = 'shake 0.5s';
      setTimeout(() => { userIdInput.style.animation = ''; }, 500);
    }
    if (!pass) {
      passwordInput.style.animation = 'shake 0.5s';
      setTimeout(() => { passwordInput.style.animation = ''; }, 500);
    }
    
    // Add shake animation keyframes
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(styleSheet);
    
    return;
  }

  // Show loader
  showLoader();

  try {
    // Try to use the real API
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "login",
        id: id,
        password: pass
      })
    }).then(r => r.json());
    
    // If we get a response, process it
    if (!res.success) {
      hideLoader();
      showError("Invalid credentials. Please try again.");
      return;
    }
    
    // Save session token
    sessionStorage.setItem("sessionToken", res.token);
    sessionStorage.setItem("userRole", res.role);
    
    // Simulate processing delay
    setTimeout(() => {
      hideLoader();
      
      // Role-based redirect
      if (res.role === "Admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "coordinator.html";
      }
    }, 1000);
    
  } catch (error) {
    // If API fails, use mock data for demo
    console.log("API error, using mock data for demo:", error);
    
    const mockRes = await mockApiRequest(id, pass);
    
    setTimeout(() => {
      hideLoader();
      
      if (!mockRes.success) {
        showError("Invalid credentials. Please try again.");
        return;
      }
      
      // Save session token
      sessionStorage.setItem("sessionToken", mockRes.token);
      sessionStorage.setItem("userRole", mockRes.role);
      
      // Show success message before redirect
      errorText.textContent = "Login successful! Redirecting...";
      errorElement.style.color = "#4caf50";
      errorElement.classList.add('show');
      
      // Role-based redirect after delay
      setTimeout(() => {
        if (mockRes.role === "Admin") {
          window.location.href = "admin.html";
        } else {
          window.location.href = "coordinator.html";
        }
      }, 1500);
    }, 1500);
  }
}

// Allow login with Enter key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    login();
  }
});

// Input field focus effects
const inputs = document.querySelectorAll('.input-field');
inputs.forEach(input => {
  input.addEventListener('focus', function() {
    this.parentElement.style.transform = 'translateY(-2px)';
  });
  
  input.addEventListener('blur', function() {
    this.parentElement.style.transform = 'translateY(0)';
  });
});
</script>

</body>

</html>
